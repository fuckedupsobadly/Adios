{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-title">SENTENCE_PREDICTOR / KZ</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="field">
      <label>New password <span style="color:#bbb">(min 8 chars)</span></label>
      <input type="password" name="password" form="rp-form" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label>Confirm new password</label>
      <input type="password" name="confirm_password" form="rp-form" autocomplete="new-password" required>
    </div>
    <button class="btn" form="rp-form" type="submit" style="width:100%">Update password</button>

    <form id="rp-form" method="POST" action="{{ url_for('reset_password', token=token) }}" style="display:none"></form>
  </div>
</div>
{% endblock %}
